<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telegram test</title><body style="font-family:sans-serif;padding:20px;line-height:1.6"><h2>Telegram test</h2><pre id="o" style="white-space:pre-wrap;font-size:16px"></pre><script src="config.js"></script><script>
var o=document.getElementById("o");function L(t){o.textContent+=t+"\n"}

else{L("Token: "+(TG_TOKEN?"found ("+TG_TOKEN.length+" characters)":"EMPTY - paste it in config.js"));L("Chat ID: "+(TG_CHAT||"EMPTY"));

</script>
